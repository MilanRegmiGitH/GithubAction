name: Python Tests

on:
  push:
    paths:
      - "**.py"
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-pyhton@v5
      with:
        python-version: "3.13"

    - name: Install Dependencies
      run: |
        pip install -r requirements.txt
    - name: Run tests
      run: |
        pytest

